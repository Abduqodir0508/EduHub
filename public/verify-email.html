<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emailni Tasdiqlash - EduHub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- TOP TOAST CONTAINER -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

  <!-- NAVBAR -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-11 h-11 bg-gradient-to-tr from-brand-600 to-indigo-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-brand-500/30 group-hover:scale-105 transition duration-200">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <div>
          <span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">Edu<span class="text-brand-600">Hub</span></span>
          <span class="block text-[10px] font-bold tracking-wider text-slate-400 uppercase -mt-1">Online Academy</span>
        </div>
      </a>
      <a href="/" class="text-sm font-semibold text-slate-500 hover:text-brand-600 transition flex items-center gap-2">
        <i class="fa-solid fa-arrow-left text-xs"></i> Bosh sahifaga qaytish
      </a>
    </div>
  </header>

  <!-- ASOSIY VERIFICATION FORMA -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 max-w-lg w-full p-8 sm:p-10 text-center relative overflow-hidden">
      
      <!-- Dekorativ orqa fon belgisi -->
      <div class="absolute -top-12 -right-12 w-40 h-40 bg-brand-50 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Icon -->
      <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl shadow-inner shadow-brand-200/50">
        <i class="fa-solid fa-envelope-circle-check"></i>
      </div>

      <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
        Emailingizni tasdiqlang
      </h2>
      
      <p class="text-slate-500 text-sm mt-2 leading-relaxed">
        Quyidagi manzilga 6 xonali tasdiqlash kodi yuborildi:
      </p>

      <!-- Email ko'rsatish va o'zgartirish bloki -->
      <div class="mt-3 inline-flex items-center gap-2 px-3.5 py-1.5 bg-slate-100 rounded-full border border-slate-200">
        <i class="fa-solid fa-envelope text-brand-600 text-xs"></i>
        <span id="display-email" class="font-bold text-xs text-slate-800">yuklanmoqda...</span>
        <button onclick="promptChangeEmail()" title="Emailni o'zgartirish" class="text-slate-400 hover:text-brand-600 text-xs ml-1">
          <i class="fa-solid fa-pen"></i>
        </button>
      </div>

      <!-- OTP INPUT KATAKCHALARI (6 ta raqam) -->
      <form id="otp-form" onsubmit="handleVerifySubmit(event)" class="mt-8">
        <div class="flex items-center justify-center gap-2 sm:gap-3 mb-6" id="otp-inputs-container">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-11 h-14 sm:w-13 sm:h-16 text-center text-2xl font-extrabold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition" autofocus>
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-11 h-14 sm:w-13 sm:h-16 text-center text-2xl font-extrabold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-11 h-14 sm:w-13 sm:h-16 text-center text-2xl font-extrabold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-11 h-14 sm:w-13 sm:h-16 text-center text-2xl font-extrabold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-11 h-14 sm:w-13 sm:h-16 text-center text-2xl font-extrabold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-11 h-14 sm:w-13 sm:h-16 text-center text-2xl font-extrabold text-slate-800 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition">
        </div>

        <!-- Xatolik xabari joylashuvi -->
        <div id="error-message" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-600 text-xs font-semibold"></div>

        <!-- Tasdiqlash tugmasi -->
        <button 
          type="submit" 
          id="verify-btn" 
          class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg shadow-brand-600/30 hover:shadow-brand-600/50 transition duration-200 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-check"></i>
          <span>Emailni tasdiqlash</span>
        </button>
      </form>

      <!-- Qayta yuborish (Resend OTP) va 60s taymer -->
      <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col items-center gap-2">
        <p class="text-xs text-slate-500">Kodni olmadingizmi?</p>
        <button 
          id="resend-btn" 
          onclick="handleResendCode()" 
          disabled 
          class="text-xs font-bold text-slate-400 cursor-not-allowed transition flex items-center gap-1.5"
        >
          <i class="fa-solid fa-rotate-right text-xs"></i>
          <span id="resend-text">Kodni qayta yuborish (<span id="timer-count">60</span>s)</span>
        </button>
      </div>

    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let userEmail = '';
    let countdown = 60;
    let timerInterval = null;

    // Sahifa yuklanganda URL parametrlarini olish va taymerni boshlash
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      userEmail = urlParams.get('email') || localStorage.getItem('eduhub_pending_email') || '';

      if (!userEmail) {
        promptChangeEmail();
      } else {
        updateEmailDisplay();
      }

      setupOtpInputs();
      startCountdown(60);
    });

    function updateEmailDisplay() {
      document.getElementById('display-email').innerText = userEmail;
      localStorage.setItem('eduhub_pending_email', userEmail);
    }

    function promptChangeEmail() {
      const entered = prompt("Iltimos, ro'yxatdan o'tgan email manzilingizni kiriting:", userEmail);
      if (entered && entered.trim()) {
        userEmail = entered.trim();
        updateEmailDisplay();
      }
    }

    // 6 ta katakchaning avtomatik o'tishi, backspace va paste qilinishi
    function setupOtpInputs() {
      const inputs = document.querySelectorAll('.otp-digit');

      inputs.forEach((input, index) => {
        // Raqam kiritilganda keyingisiga o'tish
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, ''); // Faqat raqam
          e.target.value = val ? val[val.length - 1] : '';

          if (val && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          checkAndAutoSubmit();
        });

        // Backspace bosilganda oldingisiga qaytish
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // 6 ta raqamni paste (Ctrl+V) qilganda to'g'ri taqsimlash
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
          if (!pasteData) return;

          pasteData.split('').slice(0, 6).forEach((char, i) => {
            if (inputs[i]) {
              inputs[i].value = char;
            }
          });

          const nextIndex = Math.min(pasteData.length, inputs.length - 1);
          inputs[nextIndex].focus();
          checkAndAutoSubmit();
        });
      });
    }

    // Agar 6 ta raqam to'liq kiritilsa avtomatik submit
    function checkAndAutoSubmit() {
      const code = getOtpCode();
      if (code.length === 6) {
        document.getElementById('verify-btn').click();
      }
    }

    function getOtpCode() {
      const inputs = document.querySelectorAll('.otp-digit');
      return Array.from(inputs).map(input => input.value).join('');
    }

    // 60 soniyalik teskari taymer
    function startCountdown(seconds) {
      clearInterval(timerInterval);
      countdown = seconds;
      const resendBtn = document.getElementById('resend-btn');
      const timerCount = document.getElementById('timer-count');
      const resendText = document.getElementById('resend-text');

      resendBtn.disabled = true;
      resendBtn.className = 'text-xs font-bold text-slate-400 cursor-not-allowed transition flex items-center gap-1.5';
      resendText.innerHTML = `Kodni qayta yuborish (<span id="timer-count">${countdown}</span>s)`;

      timerInterval = setInterval(() => {
        countdown--;
        const timerSpan = document.getElementById('timer-count');
        if (timerSpan) timerSpan.innerText = countdown;

        if (countdown <= 0) {
          clearInterval(timerInterval);
          resendBtn.disabled = false;
          resendBtn.className = 'text-xs font-bold text-brand-600 hover:text-brand-700 cursor-pointer transition flex items-center gap-1.5';
          resendText.innerHTML = `Kodni qayta yuborish`;
        }
      }, 1000);
    }

    // Kodni qayta yuborish (Resend OTP)
    async function handleResendCode() {
      if (!userEmail) {
        promptChangeEmail();
        return;
      }

      const resendBtn = document.getElementById('resend-btn');
      resendBtn.disabled = true;

      try {
        const res = await fetch('/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showToast("Yangi tasdiqlash kodi emailingizga yuborildi!", "success");
          startCountdown(60);
          // Katakchalarni tozalash
          document.querySelectorAll('.otp-digit').forEach(inp => inp.value = '');
          document.querySelector('.otp-digit').focus();
        } else {
          if (data.remainingSeconds) {
            startCountdown(data.remainingSeconds);
          }
          showToast(data.message || "Kodni qayta yuborishda xatolik yuz berdi", "error");
        }
      } catch (err) {
        showToast("Server bilan bog'lanishda xatolik", "error");
        resendBtn.disabled = false;
      }
    }

    // Kodni tasdiqlash (Verify OTP)
    async function handleVerifySubmit(e) {
      e.preventDefault();
      hideError();

      const code = getOtpCode();
      if (code.length !== 6) {
        showError("Iltimos, 6 xonali tasdiqlash kodini to'liq kiriting");
        return;
      }

      if (!userEmail) {
        promptChangeEmail();
        return;
      }

      const btn = document.getElementById('verify-btn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Tekshirilmoqda...`;

      try {
        const res = await fetch('/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: userEmail, code })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showToast("Emailingiz muvaffaqiyatli tasdiqlandi!", "success");

          // Agar token qaytsa uni saqlash (avtologin)
          if (data.accessToken) {
            localStorage.setItem('eduhub_access_token', data.accessToken);
          }
          localStorage.removeItem('eduhub_pending_email');

          btn.innerHTML = `<i class="fa-solid fa-circle-check mr-2 text-emerald-400"></i> Muvaffaqiyatli! Bosh sahifaga o'tilmoqda...`;

          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          showError(data.message || "Tasdiqlash kodi noto'g'ri yoki muddati tugagan");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> Emailni tasdiqlash`;
        }
      } catch (err) {
        showError("Server bilan bog'lanishda xatolik yuz berdi");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> Emailni tasdiqlash`;
      }
    }

    function showError(msg) {
      const errBox = document.getElementById('error-message');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    function hideError() {
      const errBox = document.getElementById('error-message');
      errBox.classList.add('hidden');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const icons = {
        success: 'fa-circle-check text-emerald-500',
        error: 'fa-circle-xmark text-rose-500',
        info: 'fa-circle-info text-sky-500'
      };

      toast.className = `toast flex items-center gap-3 px-5 py-3.5 bg-white rounded-2xl shadow-xl border border-slate-200 text-sm font-semibold text-slate-800 min-w-[280px]`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg"></i>
        <span class="flex-1">${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>
</html>
